name: Deploy Ledger to GitHub Pages

# Publishes the static app to GitHub Pages on every push. The first successful
# run also enables Pages for the repo (enablement: true), so you shouldn't need
# to flip any settings by hand — but if Pages isn't on yet, you can also enable
# it under Settings → Pages → Source → "GitHub Actions".

on:
  push:
    branches:
      - main
      - claude/ledger-expense-tracker-g94o2w
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site (app files only)
        run: |
          mkdir -p _site/vendor
          cp index.html styles.css app.js config.js _site/
          cp vendor/xlsx.full.min.js _site/vendor/

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
