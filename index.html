<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger — Personal Finance Tracker</title>
<meta name="description" content="A minimal personal finance ledger with multi-currency support, categories, recurring expenses and spreadsheet import.">

<!-- Social share preview (Open Graph + Twitter). Absolute URLs are required by
     scrapers like WhatsApp; they point at the primary (Netlify) deployment. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ledger">
<meta property="og:title" content="Ledger — Personal Finance Tracker">
<meta property="og:description" content="Track income, expenses and savings month by month — multi-currency, categories, recurring items and spreadsheet import.">
<meta property="og:url" content="https://myldgr.netlify.app/">
<meta property="og:image" content="https://myldgr.netlify.app/og-banner.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Ledger — your money, month by month.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ledger — Personal Finance Tracker">
<meta name="twitter:description" content="Track income, expenses and savings month by month — multi-currency, categories, recurring items and spreadsheet import.">
<meta name="twitter:image" content="https://myldgr.netlify.app/og-banner.png">

<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app"><!-- rendered by app.js --></div>

  <!-- Hidden file input used by the spreadsheet importer -->
  <input id="fileInput" type="file" accept=".xls,.xlsx,.xlsm,.csv" style="display:none">

  <script src="config.js"></script>
  <script src="vendor/xlsx.full.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
